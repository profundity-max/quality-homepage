pid /tmp/nginx.pid;
events {}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # TPL-06：模板单文件上限 500 MB，代理请求体上限同步放宽（含文件头开销）
  client_max_body_size 550m;
  # 用 Docker 内嵌 DNS 定期重新解析后端，避免 web 容器重建后缓存旧 IP 导致 502
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;
  server {
    listen 8080;
    absolute_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    location = /wz {
      return 308 /wz/;
    }

    # 品集签发的物资追溯授权只在入口使用一次；后续请求由 HttpOnly Cookie 续验。
    location = /__qnexus_wuzhi_grant_check {
      internal;
      auth_request off;
      proxy_pass http://web:3000/api/apps/wuzhi-trace/access;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header X-Q-Nexus-Grant $arg_token;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }

    location = /wz/__qnexus_entry {
      access_log off;
      auth_request /__qnexus_wuzhi_grant_check;
      error_page 401 403 =302 /apps/wuzhi-trace?access=expired;
      add_header Set-Cookie "q_nexus_wuzhi_grant=$arg_token; Path=/wz/; HttpOnly; SameSite=Lax" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "DENY" always;
      return 302 /wz/;
    }

    location = /__qnexus_wuzhi_auth {
      internal;
      auth_request off;
      proxy_pass http://web:3000/api/apps/wuzhi-trace/access;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header X-Q-Nexus-Grant $cookie_q_nexus_wuzhi_grant;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }

    location /wz/ {
      auth_request /__qnexus_wuzhi_auth;
      auth_request_set $qnexus_subject $upstream_http_x_q_nexus_subject;
      auth_request_set $qnexus_username $upstream_http_x_q_nexus_username_b64;
      auth_request_set $qnexus_display_name $upstream_http_x_q_nexus_display_name_b64;
      auth_request_set $qnexus_role $upstream_http_x_q_nexus_role;
      error_page 401 403 =302 /apps/wuzhi-trace?access=expired;

      proxy_pass http://wuzhi-trace:8082/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Q-Nexus-Subject $qnexus_subject;
      proxy_set_header X-Q-Nexus-Username-B64 $qnexus_username;
      proxy_set_header X-Q-Nexus-Display-Name-B64 $qnexus_display_name;
      proxy_set_header X-Q-Nexus-Role $qnexus_role;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_redirect off;
    }

    location / {
      set $upstream_web http://web:3000;
      proxy_pass $upstream_web;
      proxy_http_version 1.1;
      # Preserve the external authority, including its port. Next.js compares
      # this forwarded value with Origin before accepting Server Actions.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
