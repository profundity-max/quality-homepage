services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: q_nexus_test
      POSTGRES_USER: q_nexus_test
      POSTGRES_PASSWORD: q_nexus_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U q_nexus_test -d q_nexus_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
