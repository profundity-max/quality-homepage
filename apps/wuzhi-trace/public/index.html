<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="D3G4d5p9FbvXg6tYwsO4lS">
<head data-page-node-id="Caqymwd0HdewWSW47KzRka">
<meta charset="utf-8" data-page-node-id="EKKpASNYcHcGEhUEE16JzI">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="e46YPpplS3KhIlyf66Q9eD">
<title>物资申领与消耗追溯 V1.2.10</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e3e8ef; --txt:#1f2937; --muted:#6b7280;
  --pri:#2563eb; --pri-soft:#eff6ff; --ok:#16a34a; --ok-soft:#f0fdf4;
  --warn:#d97706; --warn-soft:#fffbeb; --bad:#dc2626; --bad-soft:#fef2f2;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:17px;margin-right:auto;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;cursor:pointer;border:1px solid var(--line);background:#fff;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}
.pill.on .dot{background:var(--ok)} .pill.on{border-color:#bbf7d0;background:var(--ok-soft)}
.me-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:var(--pri-soft);color:var(--pri);border:1px solid #dbeafe;cursor:pointer}
.me-chip b{font-weight:600}
/* 页签 */
.tabs{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;position:sticky;top:47px;z-index:49}
.tabs button{border:none;background:none;padding:10px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.act{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
main{padding:16px;max-width:1280px;margin:0 auto}
main.wide-pane{max-width:none;width:100%;padding:12px 12px 18px}
.tabpane{display:none}.tabpane.act{display:block}
/* 卡片与表格 */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{margin-left:auto;max-width:55%;text-align:right;white-space:normal;font-weight:400;font-size:12px;color:var(--muted);line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;background:#f9fafb;white-space:nowrap;position:sticky;top:0}
tbody tr:hover{background:#f8fafc}
.twrap{overflow:auto;max-height:62vh}
.purchase-ledger-card{padding:12px}
.purchase-ledger-scroll{overflow:auto;width:100%;height:calc(100vh - 215px);min-height:500px;max-height:900px;border:1px solid #dbe3ec;border-radius:8px;background:#fff}
.purchase-ledger-table{width:100%;min-width:4260px;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:11px;background:#fff}
.purchase-ledger-table col.purchase-col-long{width:190px}.purchase-ledger-table col.purchase-col-status{width:112px}.purchase-ledger-table col.purchase-col-action{width:144px}
.purchase-ledger-table th,.purchase-ledger-table td{padding:6px 8px;line-height:16px;border-bottom:1px solid #e8edf3;border-right:1px solid #eef2f6;text-align:left;vertical-align:middle;white-space:normal;word-break:normal;overflow-wrap:break-word}
.purchase-ledger-table th{height:52px;background:#eef4fa;color:#334155;font-weight:700;position:sticky;top:0;z-index:4;text-align:left;line-height:15px}
.purchase-ledger-table tbody tr{--row-bg:#fff;height:52px}
.purchase-ledger-table tbody tr:nth-child(even){--row-bg:#f8fafc}
.purchase-ledger-table tbody tr:hover{--row-bg:#eef6ff}
.purchase-ledger-table tbody td{height:52px;background:var(--row-bg)}
.purchase-ledger-table tbody tr:hover td{background:var(--row-bg)}
.purchase-cell{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:32px;line-height:16px}
.purchase-ledger-table .purchase-num-cell,.purchase-ledger-table .purchase-date-cell{font-variant-numeric:tabular-nums;white-space:nowrap}
.purchase-ledger-table .purchase-num-cell{text-align:right}
.purchase-ledger-table .purchase-date-cell{text-align:left}
.purchase-ledger-table .purchase-seq-col{position:sticky;left:0;z-index:3;background:var(--row-bg);box-shadow:5px 0 8px -7px rgba(15,23,42,.5)}
.purchase-ledger-table th.purchase-seq-col{z-index:7;background:#eef4fa}
.purchase-ledger-table .purchase-action-cell{position:sticky;right:0;z-index:3;width:240px;min-width:240px;background:var(--row-bg);text-align:center;white-space:nowrap;box-shadow:-5px 0 8px -7px rgba(15,23,42,.5)}
.purchase-ledger-table th.purchase-action-cell{z-index:7;background:#eef4fa;text-align:left}
.purchase-ledger-table .purchase-status-cell .tag{margin:1px 0}
.purchase-row-action{display:inline-flex;align-items:center;justify-content:center;min-width:52px;margin:1px 2px;padding:3px 8px;border-radius:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.tag.gray{background:#f3f4f6;color:#4b5563}
.tag.blue{background:var(--pri-soft);color:var(--pri)}
.tag.green{background:var(--ok-soft);color:var(--ok)}
.tag.yellow{background:var(--warn-soft);color:var(--warn)}
.tag.red{background:var(--bad-soft);color:var(--bad)}
/* 按钮/表单 */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--txt)}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#1d4ed8}
.btn.danger{color:var(--bad);border-color:#fecaca}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--pri)}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.frow label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.frow input,.frow select,.frow textarea{min-width:130px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px}
.kpi .v{font-size:22px;font-weight:700;margin:4px 0 2px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .s{font-size:11px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
/* 模态 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin-bottom:12px;font-size:16px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast .t{background:#111827;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;max-width:min(680px,92vw);white-space:normal;line-height:1.6;cursor:pointer}
#toast .t.show{opacity:1}
/* 分级提示框（2026-11-17 UI 优化）：替代状态条内多色文字堆叠 */
.note{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.7;border:1px solid;border-left-width:3px}
.note b{font-weight:600}
.note.warn{background:var(--warn-soft);border-color:#fde68a;border-left-color:var(--warn);color:#92400e}
.note.err{background:var(--bad-soft);border-color:#fecaca;border-left-color:var(--bad);color:#991b1b}
.note.info{background:var(--pri-soft);border-color:#bfdbfe;border-left-color:var(--pri);color:#1e40af}
/* 云端明细 chips：替代长串括号文本 */
.chips{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.chip{background:#eef2f7;border:1px solid #e3e8ef;border-radius:6px;padding:1px 7px;font-size:12px;color:#475569;white-space:nowrap}
/* 按钮分组行 */
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btnrow .spacer{flex:1}
/* 身份徽章 */
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe;white-space:nowrap}
.badge.warnbg{background:#fef3c7;color:#92400e;border-color:#fde68a}
/* 签名板 */
.sigpad{border:1px dashed #94a3b8;border-radius:10px;background:#fff;touch-action:none;cursor:crosshair;display:block}
.muted{color:var(--muted);font-size:12px}
.linklike{background:none;border:none;color:var(--pri);cursor:pointer;font-size:12px;padding:0}
.bar{display:flex;align-items:flex-end;gap:10px;height:120px;padding:4px 2px}
.bar .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.bar .col .b{width:70%;max-width:46px;border-radius:6px 6px 0 0;background:var(--pri)}
.bar .col .n{font-size:11px;color:var(--muted);white-space:nowrap}
.logline{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.logline .t{color:var(--muted);font-size:11px;margin-right:8px}
.imp-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;font-size:12px;margin:8px 0}
.imp-grid .h{font-weight:600;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.source-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:linear-gradient(150deg,#f8fafc,var(--card) 65%)}
.source-card h4{margin:0;font-size:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.source-subtitle{font-size:12px;font-weight:400;color:var(--muted)}
.source-body{margin-top:10px}
.source-row{display:grid;grid-template-columns:92px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.source-row:first-child{border-top:0}
.source-label{font-size:13px;color:var(--text)}
.source-track{height:14px;background:#edf2f7;border-radius:5px;overflow:hidden}
.source-fill{height:100%;background:linear-gradient(90deg,#5b8def,#3b6fd8);border-radius:5px;transition:width .25s ease}
.source-value{text-align:right;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.source-link{background:none;border:0;padding:0;color:var(--pri);font:inherit;font-weight:700;cursor:pointer}
.source-link:hover{text-decoration:underline}
.source-meta{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px}
.source-note{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:760px){.source-grid{grid-template-columns:1fr}.source-row{grid-template-columns:82px minmax(0,1fr) 78px}}
@media print{.topbar,.tabs,.btn{display:none!important}}
</style>
</head>
